<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm tra bài làm - 3 Mô hình</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; }
        #preview { margin-top: 20px; max-width: 300px; display: none; border: 1px solid #ccc; }
        .results-container { display: flex; gap: 20px; margin-top: 20px; }
        .model-result { flex: 1; padding: 15px; border: 1px solid #007bff; border-radius: 8px; background-color: #f8f9fa; }
        .model-title { font-weight: bold; color: #007bff; margin-bottom: 10px; border-bottom: 1px solid #ccc; padding-bottom: 5px;}
        #status { color: red; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>Hệ thống kiểm tra tổng hợp (3 Mô hình)</h2>
    
    <div id="status">Đang tải các mô hình, vui lòng đợi...</div>
    
    <input type="file" id="imageUpload" accept="image/*" disabled>
    <br>
    <img id="preview" alt="Ảnh tải lên"/>
    
    <!-- Khu vực hiển thị kết quả của 3 mô hình -->
    <div class="results-container">
        <div class="model-result">
            <div class="model-title">Mô hình 1</div>
            <div id="label-container-1"></div>
        </div>
        <div class="model-result">
            <div class="model-title">Mô hình 2</div>
            <div id="label-container-2"></div>
        </div>
        <div class="model-result">
            <div class="model-title">Mô hình 3</div>
            <div id="label-container-3"></div>
        </div>
    </div>

    <script>
        // Đường dẫn tới 3 thư mục chứa mô hình
        const URL1 = "./model_1/";
        const URL2 = "./model_2/";
        const URL3 = "./model_3/";
        
        let model1, model2, model3;

        async function init() {
            try {
                // Tải song song cả 3 mô hình để tiết kiệm thời gian
                [model1, model2, model3] = await Promise.all([
                    tmImage.load(URL1 + "model.json", URL1 + "metadata.json"),
                    tmImage.load(URL2 + "model.json", URL2 + "metadata.json"),
                    tmImage.load(URL3 + "model.json", URL3 + "metadata.json")
                ]);

                // Cho phép người dùng tải ảnh lên sau khi mô hình đã sẵn sàng
                document.getElementById("status").style.color = "green";
                document.getElementById("status").innerText = "Đã tải xong 3 mô hình. Hãy chọn ảnh để kiểm tra.";
                document.getElementById("imageUpload").disabled = false;
            } catch (error) {
                document.getElementById("status").innerText = "Lỗi khi tải mô hình. Hãy kiểm tra lại thư mục.";
                console.error(error);
            }
        }

        document.getElementById('imageUpload').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const imgElement = document.getElementById('preview');
                imgElement.src = window.URL.createObjectURL(file);
                imgElement.style.display = 'block';
                
                imgElement.onload = async function() {
                    // Xóa kết quả cũ trước khi dự đoán mới
                    document.getElementById("label-container-1").innerHTML = "Đang phân tích...";
                    document.getElementById("label-container-2").innerHTML = "Đang phân tích...";
                    document.getElementById("label-container-3").innerHTML = "Đang phân tích...";
                    
                    await predict(imgElement);
                }
            }
        });

        async function predict(imageElement) {
            // Chạy dự đoán trên cả 3 mô hình
            const predictions1 = await model1.predict(imageElement);
            const predictions2 = await model2.predict(imageElement);
            const predictions3 = await model3.predict(imageElement);
            
            // Hiển thị kết quả Mô hình 1
            displayResults(predictions1, "label-container-1");
            // Hiển thị kết quả Mô hình 2
            displayResults(predictions2, "label-container-2");
            // Hiển thị kết quả Mô hình 3
            displayResults(predictions3, "label-container-3");
        }

        // Hàm phụ trợ để in kết quả ra HTML
        function displayResults(predictions, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = ""; // Xóa chữ "Đang phân tích..."
            
            for (let i = 0; i < predictions.length; i++) {
                const text = predictions[i].className + ": " + (predictions[i].probability * 100).toFixed(2) + "%";
                const div = document.createElement("div");
                div.innerText = text;
                container.appendChild(div);
            }
        }

        // Khởi chạy ngay khi mở trang
        init();
    </script>
</body>
</html>
